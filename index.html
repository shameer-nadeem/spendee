<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Spendee</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="add" class="screen active">
    <div class="balance">
      <span class="label">Balance</span>
      <strong id="balance">Rs 0</strong>
    </div>
    <form id="quick-form" class="quick" autocomplete="off">
      <label for="quick">Quick entry</label>
      <div class="quick-row">
        <input id="quick" type="text" placeholder="lunch 6000 Ali 2000 Hamza 2500">
        <button type="submit" class="small">Fill</button>
      </div>
      <p id="parsed" class="parsed" hidden></p>
    </form>
    <form id="form" autocomplete="off">
      <label for="amount">Amount (PKR)</label>
      <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      <label for="note">Note</label>
      <input id="note" type="text" placeholder="What was it for?">
      <label>Category</label>
      <div id="chips" class="chips"></div>
      <label for="date">Date</label>
      <input id="date" type="date">
      <div id="split-box">
        <label class="toggle"><input id="split-on" type="checkbox"> Split with friends</label>
        <div id="split-body" hidden>
          <div id="rows"></div>
          <button type="button" id="add-friend" class="ghost">+ Add friend</button>
          <p id="real" class="real"></p>
        </div>
      </div>
      <datalist id="friends"></datalist>
      <button type="submit" class="primary">Save</button>
    </form>
  </section>
  <section id="dashboard" class="screen">
    <h1>Dashboard</h1>
    <label for="month" class="sr">Month</label>
    <select id="month"></select>
    <div class="balance">
      <span class="label">Balance now</span>
      <strong id="d-balance">Rs 0</strong>
    </div>
    <div class="tiles">
      <div class="tile"><span class="label">Earned</span><strong id="d-earned">Rs 0</strong></div>
      <div class="tile"><span class="label">My real spend</span><strong id="d-spend">Rs 0</strong></div>
      <div class="tile wide"><span class="label">Friends owe you</span><strong id="d-owed">Rs 0</strong></div>
    </div>
    <h2>Spend by category</h2>
    <div id="bars" class="card"></div>
    <h2>Top 3</h2>
    <ol id="top" class="top"></ol>
  </section>
  <section id="owed" class="screen"><h1>Owed</h1><div id="owed-body"></div></section>
  <section id="history" class="screen"><h1>History</h1><div id="filter" class="chips"></div><div id="hist-list"></div></section>
</main>
<nav id="tabs">
  <button data-tab="add" class="active">Add</button>
  <button data-tab="dashboard">Dashboard</button>
  <button data-tab="owed">Owed</button>
  <button data-tab="history">History</button>
</nav>
<div id="toast" class="toast"></div>
<div id="setup" class="setup" hidden>
  <form id="setup-form" autocomplete="off">
    <h1>Welcome to Spendee</h1>
    <label for="start">Your starting balance (PKR)</label>
    <input id="start" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0">
    <button type="submit" class="primary">Start</button>
  </form>
</div>
<div id="edit" class="sheet" hidden>
  <form id="edit-form" autocomplete="off">
    <h1>Edit entry</h1>
    <label for="e-amount">Amount (PKR)</label>
    <input id="e-amount" type="text" inputmode="numeric" pattern="[0-9]*">
    <label for="e-note">Note</label>
    <input id="e-note" type="text">
    <label>Category</label>
    <div id="e-chips" class="chips"></div>
    <label for="e-date">Date</label>
    <input id="e-date" type="date">
    <div id="e-splits" class="e-splits"></div>
    <button type="submit" class="primary">Save changes</button>
    <button type="button" id="e-del" class="danger">Delete</button>
    <button type="button" id="e-cancel" class="ghost">Cancel</button>
  </form>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
