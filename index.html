<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Spendee</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="add" class="screen active">
    <div class="balance">
      <span class="label">Balance</span>
      <strong id="balance">Rs 0</strong>
    </div>
    <form id="form" autocomplete="off">
      <label for="amount">Amount (PKR)</label>
      <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      <label for="note">Note</label>
      <input id="note" type="text" placeholder="What was it for?">
      <label>Category</label>
      <div id="chips" class="chips"></div>
      <label for="date">Date</label>
      <input id="date" type="date">
      <div id="split-box">
        <label class="toggle"><input id="split-on" type="checkbox"> Split with friends</label>
        <div id="split-body" hidden>
          <div id="rows"></div>
          <button type="button" id="add-friend" class="ghost">+ Add friend</button>
          <p id="real" class="real"></p>
        </div>
      </div>
      <datalist id="friends"></datalist>
      <button type="submit" class="primary">Save</button>
    </form>
  </section>
  <section id="dashboard" class="screen"><h1>Dashboard</h1></section>
  <section id="owed" class="screen"><h1>Owed</h1></section>
  <section id="history" class="screen"><h1>History</h1></section>
</main>
<nav id="tabs">
  <button data-tab="add" class="active">Add</button>
  <button data-tab="dashboard">Dashboard</button>
  <button data-tab="owed">Owed</button>
  <button data-tab="history">History</button>
</nav>
<div id="toast" class="toast"></div>
<div id="setup" class="setup" hidden>
  <form id="setup-form" autocomplete="off">
    <h1>Welcome to Spendee</h1>
    <label for="start">Your starting balance (PKR)</label>
    <input id="start" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0">
    <button type="submit" class="primary">Start</button>
  </form>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
